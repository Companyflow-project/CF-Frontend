<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
    <script type="text/javascript">
      // GitHub Pages SPA routing support (works with the 404.html redirect)
      ;(function (l) {
        // Expect URLs like /CF-Frontend/?/path/to/page
        if (l.search && l.search[1] === '/') {
          var decodedPath = l.search
            .slice(2) // drop leading "?/"
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')

          // Preserve the project base path (e.g. "/CF-Frontend")
          var basePath = l.pathname.replace(/\/$/, '')

          window.history.replaceState(
            null,
            null,
            basePath + '/' + decodedPath + l.hash
          )
        }
      })(window.location)
    </script>
    <title>CompanyFlow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
