name: deploy-github-pages

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout-develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: install-deps
        run: npm ci

      - name: build
        env:
          GITHUB_ACTIONS: 'true'
        run: npm run build

      - name: upload-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4


