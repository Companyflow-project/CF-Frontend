<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <p>Redirecting…</p>
    <script type="text/javascript">
      // GitHub Pages SPA redirect specifically for the CF-Frontend project
      ;(function () {
        var l = window.location

        // We always want to land back under /CF-Frontend
        var projectBase = '/CF-Frontend'

        // Strip the project base from the current path to get the internal route
        var internalPath = l.pathname.replace(/^\/CF-Frontend\/?/, '')

        var newUrl =
          l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          projectBase +
          '/?/' +
          internalPath.replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash

        l.replace(newUrl)
      })()
    </script>
  </body>
</html>
